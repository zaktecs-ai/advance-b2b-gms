[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "advance-b2b-gms"
version = "1.0.0"
description = "A clean-room, most-capable Google Maps B2B lead scraper"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40,<2",
    "httpx>=0.25,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=4.9,<7",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "dnspython>=2.4,<3",
    "openpyxl>=3.1,<4",
    "pydantic>=2.5,<3",
    "phonenumbers>=8.13,<10",
    "ftfy>=6.2,<7",
]

[project.optional-dependencies]
tech = ["wappalyzer-python3>=0.0.11,<1"]
test = ["pytest>=7.4,<9"]

[project.scripts]
abgms = "scraper.main:main"

[tool.setuptools.packages.find]
include = ["scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
