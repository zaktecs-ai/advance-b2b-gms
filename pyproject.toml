[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "advance-b2b-gms"
version = "1.0.0"
description = "A clean-room, most-capable Google Maps B2B lead scraper"
requires-python = ">=3.9"

[project.scripts]
abgms = "scraper.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
